global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "employee-management-system"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
        labels:
          environment: "production"
          service: "ems-api"
