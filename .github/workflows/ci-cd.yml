name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ems
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # Stage 1: Automated Testing & Code Quality
  # ============================================================================
  test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Automated Unit & Integration Tests (Pytest + Coverage)
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # Stage 2: Security Validation (SAST & Dependency CVE Audit)
  # ============================================================================
  security:
    name: Security Auditing (SAST & CVE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Security Analysis Tools
        run: |
          pip install bandit pip-audit

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r app -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

  # ============================================================================
  # Stage 3: Versioned Artifact, Docker Build & Trivy Image Scan
  # ============================================================================
  build:
    name: Build, Scan & Push Versioned Image
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compute Semantic Version Artifact Tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0.${{ github.run_number }}-${SHORT_SHA}"
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_LOWER}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${IMAGE_LOWER}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --file Dockerfile \
            --tag "${{ steps.version.outputs.image }}" \
            --tag "${{ steps.version.outputs.latest_image }}" .

      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.version.outputs.image }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Versioned Image to GHCR
        run: |
          docker push "${{ steps.version.outputs.image }}"
          docker push "${{ steps.version.outputs.latest_image }}"

  # ============================================================================
  # Stage 4: Kubernetes Deployment, Rollout & Automated Verification
  # ============================================================================
  deploy:
    name: Deploy to Kubernetes & Health Validation
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Ephemeral KIND Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind-ems

      - name: Pull and Load Versioned Image into KIND
        run: |
          docker pull "${{ needs.build.outputs.image }}"
          kind load docker-image "${{ needs.build.outputs.image }}" --name kind-ems

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/app.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl set image deployment/employee-management-system \
            ems="${{ needs.build.outputs.image }}" -n ems

      - name: Wait for Postgres Rollout
        run: |
          kubectl rollout status deployment/postgres -n ems --timeout=150s

      - name: Wait for EMS Application Rollout
        run: |
          kubectl rollout status deployment/employee-management-system -n ems --timeout=150s

      - name: Verify Health Probes & Metrics End-to-End
        run: |
          echo "Starting port-forward to ems-service..."
          kubectl port-forward svc/ems-service 8080:80 -n ems &
          PF_PID=$!
          sleep 4

          echo "Validating Liveness Probe (/health)..."
          for i in {1..12}; do
            if curl -sf http://localhost:8080/health; then
              echo "Liveness probe OK!"
              break
            fi
            sleep 2
          done

          echo "Validating Readiness Probe (/health/ready)..."
          curl --fail -s http://localhost:8080/health/ready

          echo "Validating Prometheus Metrics Endpoint (/metrics)..."
          curl --fail -s http://localhost:8080/metrics | grep -E "http_requests_total|process_cpu_seconds"

          kill $PF_PID || true
          echo "All Kubernetes deployment health checks passed successfully!"
